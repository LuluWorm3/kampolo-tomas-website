# Netlify configuration for a static site (no build step required)
[build]
  publish = "."
  functions = "netlify/functions"

# @netlify/blobs (the counter store used by the functions) needs Node 22.12 or newer.
[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/owner/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/swarm.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Internal notes and function source are not part of the public site.
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/AGENTS.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

# Pretty URLs for the role views and extra pages (also work without the trailing slash).

[[redirects]]
  from = "/data"
  to = "/data/"
  status = 301

[[redirects]]
  from = "/design"
  to = "/design/"
  status = 301

[[redirects]]
  from = "/shop"
  to = "/shop/"
  status = 301

[[redirects]]
  from = "/bank"
  to = "/bank/"
  status = 301

[[redirects]]
  from = "/cv"
  to = "/cv/"
  status = 301

[[redirects]]
  from = "/documents"
  to = "/documents/"
  status = 301

[[redirects]]
  from = "/lab"
  to = "/lab/"
  status = 301

[[redirects]]
  from = "/now"
  to = "/now/"
  status = 301

[[redirects]]
  from = "/uses"
  to = "/uses/"
  status = 301

[[redirects]]
  from = "/terminal"
  to = "/terminal/"
  status = 301

# Build scripts and their source data are not part of the public site.
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true
